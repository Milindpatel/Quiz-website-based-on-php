name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, pdo_mysql, curl, mbstring
          coverage: none
      - run: composer install --no-interaction --no-progress
      - name: Lint
        run: find public src bin -name '*.php' -print0 | xargs -0 -n1 php -l
      - run: composer test
